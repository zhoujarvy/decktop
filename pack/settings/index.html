<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../shared/style.css?v=3" />
  <style>
    .card {
      justify-content: flex-start;
      align-items: stretch;
      gap: 9px;
      padding: 14px 16px;
    }
    .head {
      display: flex;
      align-items: center;
    }
    .head .title2 {
      font-size: 15px;
      font-weight: 600;
      flex: 1;
    }
    .close-btn {
      cursor: pointer;
      color: rgba(230, 236, 245, 0.5);
      width: 24px;
      height: 24px;
      line-height: 22px;
      text-align: center;
      border-radius: 6px;
      user-select: none;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f7768e;
    }
    .section {
      font-size: 11px;
      letter-spacing: 0.14em;
      color: rgba(230, 236, 245, 0.4);
      margin-top: 4px;
    }
    .lang-row {
      display: flex;
      gap: 8px;
    }
    .lang-row button {
      cursor: pointer;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: rgba(230, 236, 245, 0.7);
      font-size: 12px;
      padding: 4px 12px;
      font-family: inherit;
    }
    .lang-row button.active {
      border-color: #7aa2f7;
      color: #7aa2f7;
    }
    .toggles {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 12px;
    }
    .toggles label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: rgba(230, 236, 245, 0.85);
      cursor: pointer;
      user-select: none;
    }
    .toggles input[type='checkbox'] {
      accent-color: #7aa2f7;
      width: 15px;
      height: 15px;
    }
    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .field .name {
      font-size: 12px;
      color: rgba(230, 236, 245, 0.6);
    }
    .field input[type='text'],
    .field input[type='password'] {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #e6ecf5;
      font-size: 13px;
      padding: 6px 10px;
      outline: none;
      font-family: inherit;
    }
    .field input:focus {
      border-color: rgba(122, 162, 247, 0.6);
    }
    .row2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }
    .save-btn {
      margin-top: 4px;
      cursor: pointer;
      text-align: center;
      padding: 8px;
      border-radius: 8px;
      font-size: 13px;
      background: rgba(122, 162, 247, 0.9);
      color: #10131a;
      font-weight: 600;
      user-select: none;
    }
    .save-btn:hover {
      background: #7aa2f7;
    }
    .save-btn[disabled] {
      opacity: 0.5;
      cursor: wait;
    }
    .reset-btn {
      cursor: pointer;
      text-align: center;
      padding: 6px;
      border-radius: 8px;
      font-size: 12px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: rgba(230, 236, 245, 0.7);
      user-select: none;
    }
    .reset-btn:hover {
      border-color: rgba(247, 118, 142, 0.6);
      color: #f7768e;
    }
    .status {
      text-align: center;
      font-size: 12px;
      min-height: 16px;
    }
    .status.ok {
      color: #9ece6a;
    }
    .status.err {
      color: #f7768e;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="head" data-drag>
      <span class="title2" data-i18n="panel.title">小组件设置</span>
      <span class="close-btn no-drag" id="close" title="关闭">✕</span>
    </div>

    <div class="section" data-i18n="section.lang">界面语言</div>
    <div class="lang-row" id="lang-row">
      <button data-lang="zh">中文</button>
      <button data-lang="en">English</button>
    </div>

    <div class="section" data-i18n="section.cards">卡片显示</div>
    <div class="toggles" id="toggles"></div>

    <div class="section" data-i18n="section.weather">天气</div>
    <div class="field">
      <span class="name" data-i18n="field.city">城市（保存时自动解析经纬度）</span>
      <input type="text" id="city" data-i18n-ph="field.city.ph" />
    </div>

    <div class="section">GLM</div>
    <div class="field">
      <span class="name" data-i18n="field.glmkey">API Key（open.bigmodel.cn，格式 id.secret）</span>
      <input type="password" id="glm-key" data-i18n-ph="field.glmkey.ph" />
    </div>

    <div class="section" data-i18n="section.nas">NAS（飞牛 + FNOS-API）</div>
    <div class="row2">
      <div class="field">
        <span class="name" data-i18n="field.nashost">地址</span>
        <input type="text" id="nas-host" data-i18n-ph="field.nashost.ph" />
      </div>
      <div class="field">
        <span class="name">API Token</span>
        <input type="password" id="nas-token" data-i18n-ph="field.nastoken.ph" />
      </div>
    </div>
    <div class="field">
      <span class="name" data-i18n="field.watch">关注容器（逗号分隔，留空显示全部）</span>
      <input type="text" id="watch" data-i18n-ph="field.watch.ph" />
    </div>

    <div class="save-btn" id="save" data-i18n="btn.save">保存并应用</div>
    <div class="reset-btn" id="reset-layout" data-i18n="btn.resetLayout">恢复自动排列卡片</div>
    <div class="status" id="status"></div>
  </div>
  <script src="../config.js?v=3"></script>
  <script src="../shared/cards.js?v=3"></script>
  <script src="../shared/i18n.js?v=3"></script>
  <script src="../shared/zebar.bundle.js?v=3"></script>
  <script src="../shared/boot.js?v=3"></script>
  <script type="module" src="app.js?v=3"></script>
</body>
</html>
