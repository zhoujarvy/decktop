<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../shared/style.css?v=3" />
  <style>
    .net {
      margin-left: auto;
      font-size: 12px;
      color: rgba(230, 236, 245, 0.75);
      white-space: nowrap;
    }
    .net .up {
      color: #9ece6a;
    }
    .net .down {
      color: #7aa2f7;
    }

</head>

    <div class="row"><span class="label">内存</span><div class="bar"><div id="mem-bar"></div></div><span class="pct" id="mem-pct">--</span></div>
    <div class="meta" id="meta"></div>
  </div>
  <script src="../config.js?v=3"></script>
  <script src="../shared/cards.js?v=3"></script>
  <script src="../shared/zebar.bundle.js?v=3"></script>
  <script src="../shared/boot.js?v=3"></script>
  <script type="module" src="app.js?v=3"></script>

</html>
