<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../shared/style.css" />
  <style>
    .card {
      gap: 4px;
      justify-content: flex-start;
      padding: 12px 16px;
    }
    .head {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .head .nav {
      cursor: pointer;
      color: rgba(230, 236, 245, 0.55);
      font-size: 15px;
      width: 22px;
      height: 22px;
      line-height: 20px;
      text-align: center;
      border-radius: 6px;
      user-select: none;
    }
    .head .nav:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #e6ecf5;
    }
    .head .month {
      flex: 1;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
    }
    .head .today-btn {
      cursor: pointer;
      font-size: 11px;
      color: #7aa2f7;
      padding: 1px 8px;
      border: 1px solid rgba(122, 162, 247, 0.4);
      border-radius: 8px;
      user-select: none;
    }
    .lunar-today {
      text-align: center;
      font-size: 11px;
      color: rgba(230, 236, 245, 0.55);
      margin-bottom: 2px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      text-align: center;
      font-size: 12px;
      row-gap: 2px;
    }
    .grid .wd {
      color: rgba(230, 236, 245, 0.4);
      font-size: 11px;
      padding: 2px 0;
    }
    .grid .day {
      height: 21px;
      line-height: 21px;
      border-radius: 6px;
      color: rgba(230, 236, 245, 0.85);
    }
    .grid .day.dim {
      color: rgba(230, 236, 245, 0.22);
    }
    .grid .day.weekend {
      color: rgba(247, 118, 142, 0.75);
    }
    .grid .day.dim.weekend {
      color: rgba(247, 118, 142, 0.25);
    }
    .grid .day.today {
      background: #7aa2f7;
      color: #10131a;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="head">
      <span class="nav" id="prev" title="上个月">‹</span>
      <span class="month" id="month">--</span>
      <span class="today-btn" id="back-today">今天</span>
      <span class="nav" id="next" title="下个月">›</span>
    </div>
    <div class="lunar-today" id="lunar-today">--</div>
    <div class="grid" id="grid"></div>
  </div>
  <script src="../config.js"></script>
  <script src="../shared/cards.js"></script>
  <script src="../shared/boot.js"></script>
  <script src="../shared/solarlunar.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
