<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <link rel="stylesheet" href="../shared/style.css?v=3" />
  <style>
    .main {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .temp {
      font-size: 34px;
      font-weight: 600;
    }
    .desc {
      font-size: 14px;
      color: rgba(230, 236, 245, 0.8);
      text-align: right;
    }
    .days {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: rgba(230, 236, 245, 0.6);
    }
    .days .d {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }
    .days .d .hi {
      color: #e6ecf5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title" data-drag><span id="city">--</span></div>
    <div class="main">
      <div class="temp" id="temp">--°</div>
      <div class="desc">
        <div id="cond">加载中…</div>
        <div id="range">-- / --</div>
      </div>
    </div>
    <div class="days" id="days"></div>
  </div>
  <script src="../config.js?v=3"></script>
  <script src="../shared/cards.js?v=3"></script>
  <script src="../shared/zebar.bundle.js?v=3"></script>
  <script src="../shared/boot.js?v=3"></script>
  <script src="app.js?v=3"></script>
</body>
</html>
